! Sample Cisco CME backup
voice register global
  mode cme
  source-address 10.0.0.1 port 2000
  max-dn 100

voice register pool 1
  id mac 0011.2233.4455
  type SCCP
  number 2001
  name 2001
  description "Ramal 2001"

voice register pool 2
  id mac 0011.2233.5566
  type SCCP
  number 2002
  name 2002
  description "Ramal 2002"

voice register dn 2001
  number 2001
  name "Atendimento"
  label "Atendimento"
  pool 1

voice register dn 2002
  number 2002
  name "Suporte"
  label "Suporte"
  pool 2

!
ephone-dn 1
  number 2001
  label 2001
  name "Atendimento"
  description "Ramais de atendimento"
  alerting-service none

ephone-dn 2
  number 2002
  label 2002
  name "Suporte"
  description "Ramal de suporte"

!
ephone 1
  mac-address 0011.2233.4455
  type 7945
  button 1:1

ephone 2
  mac-address 0011.2233.5566
  type 7945
  button 1:2
